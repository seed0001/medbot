name: Build Amy Android app

# Builds the signed APK whenever the app shell changes, and commits it to
# public/app/amy.apk so the website serves it ("Get the Android app" button).
# The publish commit only touches public/app/, which is outside the path
# filters below, so it cannot retrigger this workflow.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'www/**'
      - 'capacitor.config.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Build signed release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Publish APK to the website
        run: |
          mkdir -p public/app
          cp android/app/build/outputs/apk/release/app-release.apk public/app/amy.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/app/amy.apk
          if git diff --cached --quiet; then
            echo "APK unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "Publish Amy Android APK [skip ci]"
          git pull --rebase origin main
          git push origin main
